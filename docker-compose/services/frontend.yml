version: '3.9'

services:
  frontend:
    build:
      context: /www/blockscout-frontend-custom
      dockerfile: Dockerfile
    image: blockscout-frontend:local
    platform: linux/amd64
    restart: always
    container_name: 'frontend'
    env_file:
      -  ../envs/common-frontend.env
    ports:
      - "3000:3000"