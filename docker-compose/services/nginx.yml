version: '3.9'
services:
  proxy:
    image: nginx
    container_name: proxy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - "../proxy/default.conf.template:/etc/nginx/conf.d/default.conf"
      - "./ssl:/etc/nginx/ssl"
    ports:
      - target: 80
        published: 4000
      - target: 443
        published: 4443
      - target: 8080
        published: 4001
      - target: 8081
        published: 4002
    command: >
      sh -c "
        rm -f /docker-entrypoint.d/20-envsubst-on-templates.sh &&
        nginx -g 'daemon off;'
      "
    depends_on:
      - backend
      - frontend
