version: '3.9'

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  backend:
    depends_on:
      - db
      - redis-db
    extends:
      file: ./services/backend.yml
      service: backend
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 8.1.2
    links:
      - db:database
    environment:
        ETHEREUM_JSONRPC_HTTP_URL: http://206.238.196.207:9944
        ETHEREUM_JSONRPC_TRACE_URL: http://206.238.196.207:9944
        ETHEREUM_JSONRPC_WS_URL: ws://206.238.196.207:9944
        ECTO_USE_SSL: 'false'
        CHAIN_ID: '1'
        API_V2_ENABLED: 'true'
        MIX_ENV: 'prod'

  nft_media_handler:
    depends_on:
      - backend
    extends:
      file: ./services/nft_media_handler.yml
      service: nft_media_handler
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 8.1.2

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider


  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer

  frontend:
    extends:
      file: ./services/frontend.yml
      service: frontend
    environment:
      - NEXT_PUBLIC_API_HOST=localhost:4000
      - NEXT_PUBLIC_API_PROTOCOL=http
      - NEXT_PUBLIC_STATS_API_HOST=http://localhost:4001
      - NEXT_PUBLIC_API_BASE_PATH=
      - NEXT_PUBLIC_APP_HOST=localhost:4000
      - NEXT_PUBLIC_APP_PROTOCOL=http
      - NEXT_PUBLIC_VISUALIZE_API_HOST=http://localhost:4002
      - NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL=ws
      - NEXT_PUBLIC_NETWORK_LOGO=http://localhost:4000/assets/configs/network_logo.svg

  proxy:
    depends_on:
      - backend
      - stats
      - frontend
    extends:
      file: ./services/nginx.yml
      service: proxy
    environment:
      - FRONT_PROXY_PASS=http://frontend:3000
