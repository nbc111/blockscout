name: Update Blockscout (Current Repository)

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main, master ]  # 当推送到主分支时自动触发

jobs:
  update-blockscout:
    name: Update Blockscout from Current Repo
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout current repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，确保能获取所有分支信息

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful'"

      - name: Stop containers and pull latest code
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.BLOCKSCOUT_DIR }} &&
            # 停止当前运行的容器
            docker-compose -f ./docker-compose/docker-compose.yml down &&
            echo 'STOPPED DOCKER COMPOSE' &&
            # 拉取最新代码
            git pull &&
            echo 'PULLED LATEST CODE'
          "
      
      - name: Run database migrations
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.BLOCKSCOUT_DIR }} &&
            # 关键：指定配置文件路径
            docker-compose -f ./docker-compose/docker-compose.yml up -d --build &&
            echo 'completed success'
          "
