name: Update Blockscout (Current Repository)

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main, master ]  # 当推送到主分支时自动触发

jobs:
  update-blockscout:
    name: Update Blockscout from Current Repo
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout current repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，确保能获取所有分支信息

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful'"

      - name: Backup current state on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.BLOCKSCOUT_DIR }} &&
            TIMESTAMP=\$(date +%Y%m%d%H%M%S) &&
            # 关键：指定 docker-compose 子文件夹中的配置文件
            docker-compose -f ./docker-compose/docker-compose.yml down &&
            cp -r . ./backups/full_backup_\$TIMESTAMP/ &&
            echo 'Server backup created: full_backup_\$TIMESTAMP'
          "
      
      - name: Build frontend assets on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.BLOCKSCOUT_DIR }} &&
            # 关键：通过 -f 指定配置文件路径
            docker-compose -f ./docker-compose/docker-compose.yml run --rm frontend-build bash -c '
              npm install &&
              npm run build &&
              echo 'Frontend build completed'
            '
          "
      
      - name: Rebuild and start containers
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.BLOCKSCOUT_DIR }} &&
            # 关键：指定配置文件路径
            docker-compose -f ./docker-compose/docker-compose.yml up -d --build &&
            echo 'Containers rebuilt and started'
          "
      
      - name: Run database migrations
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.BLOCKSCOUT_DIR }} &&
            # 关键：指定配置文件路径
            docker-compose -f ./docker-compose/docker-compose.yml exec -T web mix ecto.migrate &&
            echo 'Database migrations completed'
          "
      
      - name: Rollback on failure
        if: steps.health-check.outcome == 'failure'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.BLOCKSCOUT_DIR }} &&
            echo 'Deployment failed, initiating rollback...' &&
            # 关键：指定配置文件路径
            docker-compose -f ./docker-compose/docker-compose.yml down &&
            LATEST_BACKUP=\$(ls -td ./backups/full_backup_* | head -1) &&
            rm -rf ./* &&
            cp -r \$LATEST_BACKUP/* . &&
            # 关键：指定配置文件路径
            docker-compose -f ./docker-compose/docker-compose.yml up -d &&
            echo 'Rollback completed'
          "
